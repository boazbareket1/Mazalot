<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>מזלות — מסע גילוי עצמי</title>
<!--
  מזלות — מסע גילוי עצמי
  קובץ HTML עצמאי. מצב נשמר ב-localStorage.

  מבנה הקובץ:
  1. <style>     — עיצוב: לוח ענבר-כחול-כהה, גופן David Libre + Heebo.
  2. ZODIAC_DATA — 12 מזלות, כל אחד עם 4 תכונות מפורטות (אור + צל + שאלה לחשיבה).
  3. zodiacForDate() — חישוב מזל מדויק לפי יום+חודש.
  4. Screen components: Intro → Reveal → Traits → Portrait.
  5. localStorage — שמירת פרופיל אוטומטית.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;700&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0f1118;
    --bg-card:   #181b25;
    --bg-card-2: #1e2130;
    --edge:      rgba(255,255,255,.07);
    --edge-warm: rgba(220,180,100,.22);
    --amber:     #d4a043;
    --amber-dim: #9a6e26;
    --amber-glow:rgba(212,160,67,.18);
    --sky:       #5b8fc4;
    --sky-dim:   rgba(91,143,196,.15);
    --ink:       #ede9e0;
    --ink-mid:   #9a9791;
    --ink-dim:   #5c5a56;
    --good:      #5c8f60;
    --bad:       #8f5c5c;
    --r-card:    20px;
    --r-sm:      12px;
    --font-h:    'David Libre', serif;
    --font-b:    'Heebo', sans-serif;
    --transition:.3s cubic-bezier(.4,.1,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-b);}
  h1,h2,h3,.serif{font-family:var(--font-h);}
  button{font-family:var(--font-b); cursor:pointer;}
  ::selection{background:var(--amber-glow); color:var(--ink);}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber); outline-offset:3px; border-radius:8px;}
  input:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  /* ══ Layout ══ */
  .shell{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  .page{width:100%; max-width:640px; padding:0 18px 80px; flex:1;}
  header.top{
    position:sticky; top:0; z-index:40; width:100%;
    background:rgba(15,17,24,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--edge); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .top-brand{display:flex; align-items:center; gap:10px;}
  .top-brand .sym{font-size:1.5rem; line-height:1;}
  .top-brand h1{font-size:1rem; font-weight:700; color:var(--ink);}
  .top-brand p{font-size:.68rem; color:var(--ink-mid); margin-top:1px;}
  .top-right{display:flex; gap:8px; align-items:center;}
  .ghost{
    background:transparent; border:1px solid var(--edge); color:var(--ink-mid);
    padding:7px 14px; border-radius:999px; font-size:.74rem; font-weight:600; transition:.2s;
  }
  .ghost:hover{border-color:var(--amber); color:var(--amber);}
  .tab-bar{
    display:flex; border-bottom:1px solid var(--edge); margin-bottom:26px;
  }
  .tab{
    flex:1; padding:14px 6px; font-size:.78rem; font-weight:600; text-align:center;
    background:transparent; border:none; color:var(--ink-dim); position:relative; transition:.2s;
  }
  .tab.active{color:var(--amber);}
  .tab.active::after{
    content:''; position:absolute; bottom:-1px; left:15%; right:15%; height:2px;
    background:var(--amber); border-radius:2px 2px 0 0;
  }
  .tab:disabled{opacity:.3; cursor:default;}

  /* ══ Intro screen ══ */
  .intro-wrap{
    display:flex; flex-direction:column; align-items:center;
    padding-top:60px; text-align:center; gap:0;
  }
  .intro-symbol{
    font-size:5rem; line-height:1; margin-bottom:28px;
    animation:floatY 4s ease-in-out infinite;
  }
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @media (prefers-reduced-motion:reduce){.intro-symbol{animation:none;}}
  .intro-wrap h2{font-size:2rem; font-weight:700; color:var(--ink); line-height:1.2; margin-bottom:10px;}
  .intro-wrap p{font-size:.95rem; color:var(--ink-mid); line-height:1.7; max-width:380px; margin:0 auto 36px;}
  .date-box{
    width:100%; max-width:340px; background:var(--bg-card);
    border:1px solid var(--edge-warm); border-radius:var(--r-card); padding:26px 22px;
  }
  .date-box label{display:block; font-size:.78rem; font-weight:700; color:var(--ink-mid); margin-bottom:8px; text-align:right;}
  .date-input{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:13px 14px; color:var(--ink);
    font-size:1rem; font-family:var(--font-b); text-align:center; transition:.2s;
  }
  .date-input:hover{border-color:var(--edge-warm);}
  .big-btn{
    display:block; width:100%; margin-top:14px;
    background:var(--amber); color:#1c1204; border:none;
    padding:15px; border-radius:var(--r-sm); font-weight:800; font-size:.95rem; transition:.2s;
  }
  .big-btn:hover{filter:brightness(1.08);}
  .big-btn:disabled{opacity:.45; cursor:default;}

  /* ══ Reveal screen ══ */
  .reveal-wrap{padding-top:40px; text-align:center;}
  .reveal-sym{
    font-size:5.5rem; line-height:1; margin-bottom:6px;
    color:var(--amber); text-shadow:0 0 40px rgba(212,160,67,.4);
  }
  .reveal-el{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--amber-glow); border:1px solid var(--edge-warm);
    border-radius:999px; padding:5px 14px; margin-bottom:24px;
    font-size:.8rem; font-weight:700; color:var(--amber);
  }
  .reveal-wrap h2{font-size:1.9rem; font-weight:700; margin-bottom:6px;}
  .reveal-wrap .dates-sub{font-size:.85rem; color:var(--ink-mid); margin-bottom:20px;}
  .reveal-tagline{
    font-size:1.1rem; font-style:italic; color:var(--ink-mid); line-height:1.7;
    max-width:440px; margin:0 auto 28px; padding:20px 22px;
    border-right:3px solid var(--amber); text-align:right;
  }
  .reveal-chips{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    background:var(--bg-card); border:1px solid var(--edge);
    border-radius:999px; padding:7px 14px; font-size:.78rem; color:var(--ink-mid);
  }
  .chip strong{color:var(--ink);}

  /* ══ Traits screen ══ */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .section-head h3{font-size:1.2rem; font-weight:700;}
  .section-head p{font-size:.76rem; color:var(--ink-mid); text-align:left;}

  .trait-card{
    background:var(--bg-card); border:1px solid var(--edge);
    border-radius:var(--r-card); padding:20px 20px 16px; margin-bottom:14px;
    transition:border-color var(--transition);
  }
  .trait-card:hover{border-color:var(--edge-warm);}
  .trait-card.ranked{border-color:rgba(91,143,196,.35);}

  .tc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .tc-name{font-size:1.05rem; font-weight:800; color:var(--ink);}
  .tc-custom-tag{
    font-size:.62rem; font-weight:700; background:var(--sky-dim);
    border:1px solid rgba(91,143,196,.3); color:var(--sky);
    border-radius:999px; padding:3px 9px; white-space:nowrap; margin-top:3px;
  }

  .trait-sides{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  @media (max-width:500px){.trait-sides{grid-template-columns:1fr;}}
  .side{
    border-radius:var(--r-sm); padding:11px 13px;
  }
  .side.light{background:rgba(92,143,96,.1); border:1px solid rgba(92,143,96,.2);}
  .side.shadow{background:rgba(143,92,92,.1); border:1px solid rgba(143,92,92,.2);}
  .side-label{font-size:.62rem; font-weight:800; letter-spacing:.5px; margin-bottom:5px; text-transform:uppercase;}
  .side.light .side-label{color:var(--good);}
  .side.shadow .side-label{color:var(--bad);}
  .side p{font-size:.8rem; color:var(--ink-mid); line-height:1.55;}

  .tc-question{
    background:var(--sky-dim); border-right:3px solid var(--sky);
    border-radius:0 var(--r-sm) var(--r-sm) 0; padding:10px 13px; margin-bottom:14px;
  }
  .tc-question p{font-size:.78rem; color:var(--ink-mid); line-height:1.6; font-style:italic;}

  .tc-controls{display:flex; flex-direction:column; gap:10px;}
  .control-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .control-label{font-size:.72rem; font-weight:700; color:var(--ink-mid); white-space:nowrap; min-width:90px;}
  .stars{display:flex; gap:4px; flex-direction:row-reverse;}
  .star{
    font-size:1.3rem; cursor:pointer; line-height:1; color:var(--ink-dim); transition:.15s; background:none; border:none; padding:2px;
  }
  .star.on{color:var(--amber);}
  .star:hover{transform:scale(1.15);}

  .rank-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .rank-pill{
    display:flex; gap:1px;
  }
  .rank-pip{
    width:20px; height:7px; border-radius:2px; cursor:pointer;
    background:var(--bg-card-2); border:1px solid var(--edge); transition:.15s;
  }
  .rank-pip.on{background:var(--sky); border-color:rgba(91,143,196,.4);}

  .rank-label{font-size:.68rem; color:var(--ink-dim);}

  /* add trait */
  .add-trait-btn{
    width:100%; background:transparent; border:1px dashed var(--edge);
    border-radius:var(--r-card); padding:16px; color:var(--ink-mid);
    font-size:.82rem; font-weight:600; transition:.2s; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .add-trait-btn:hover{border-color:var(--amber); color:var(--amber);}

  .add-form{
    background:var(--bg-card); border:1px solid var(--edge-warm);
    border-radius:var(--r-card); padding:18px; margin-bottom:14px;
  }
  .add-form input{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:11px 13px; color:var(--ink);
    font-size:.9rem; font-family:var(--font-b);
  }
  .add-form-row{display:flex; gap:8px; margin-top:10px;}
  .add-form-row button{flex:1; padding:11px; border-radius:var(--r-sm); font-weight:700; font-size:.82rem; border:none; transition:.2s;}
  .confirm-add{background:var(--amber); color:#1c1204;}
  .cancel-add{background:var(--bg-card-2); color:var(--ink-mid); border:1px solid var(--edge) !important;}

  /* delete custom */
  .tc-del{
    background:transparent; border:none; color:var(--ink-dim); font-size:.9rem;
    padding:4px 6px; border-radius:6px; transition:.2s; flex-shrink:0;
  }
  .tc-del:hover{color:var(--bad); background:rgba(143,92,92,.12);}

  /* ══ Portrait screen ══ */
  .portrait-hero{
    background:linear-gradient(165deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--edge-warm); border-radius:var(--r-card);
    padding:26px 22px; text-align:center; margin-bottom:22px;
  }
  .portrait-hero .sym{font-size:3.5rem; margin-bottom:8px;}
  .portrait-hero h2{font-size:1.6rem; font-weight:700; margin-bottom:4px;}
  .portrait-hero .sub{font-size:.8rem; color:var(--ink-mid);}

  .portrait-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px;}
  @media(max-width:440px){.portrait-grid{grid-template-columns:1fr;}}
  .pg-card{
    background:var(--bg-card); border:1px solid var(--edge); border-radius:var(--r-card); padding:16px;
  }
  .pg-label{font-size:.66rem; font-weight:800; color:var(--ink-dim); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px;}
  .pg-val{font-size:1.1rem; font-weight:700; color:var(--ink);}
  .pg-sub{font-size:.72rem; color:var(--ink-mid); margin-top:3px; line-height:1.5;}

  .portrait-traits{margin-bottom:22px;}
  .portrait-traits h3{font-size:1.1rem; font-weight:700; margin-bottom:14px;}
  .pt-item{
    display:flex; align-items:center; gap:12px;
    padding:13px 16px; border-radius:var(--r-sm);
    background:var(--bg-card); border:1px solid var(--edge); margin-bottom:8px;
  }
  .pt-rank{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:800; background:var(--amber-glow); color:var(--amber);
    border:1px solid var(--edge-warm);
  }
  .pt-info{flex:1;}
  .pt-name{font-weight:700; font-size:.9rem;}
  .pt-meta{font-size:.68rem; color:var(--ink-dim); margin-top:3px;}
  .pt-stars{display:flex; gap:2px; flex-direction:row-reverse;}
  .pt-star{font-size:.85rem; color:var(--ink-dim);}
  .pt-star.on{color:var(--amber);}

  .portrait-cta{
    background:var(--bg-card); border:1px solid var(--edge);
    border-radius:var(--r-card); padding:18px 20px; text-align:center; color:var(--ink-mid);
    font-size:.8rem; line-height:1.7;
  }
  .portrait-cta b{color:var(--ink);}

  /* ══ Personal note textarea ══ */
  .tc-note-wrap{margin-top:12px; border-top:1px solid var(--edge); padding-top:12px;}
  .tc-note-label{
    font-size:.7rem; font-weight:700; color:var(--ink-dim); margin-bottom:6px;
    display:flex; align-items:center; gap:5px;
  }
  .tc-note-area{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:11px 13px; color:var(--ink);
    font-size:.82rem; font-family:var(--font-b); line-height:1.6;
    resize:vertical; min-height:68px; transition:border-color .2s;
  }
  .tc-note-area:hover{border-color:var(--edge-warm);}
  .tc-note-area:focus{border-color:var(--amber); outline:none;}
  .tc-note-area::placeholder{color:var(--ink-dim);}

  /* ══ Importance — full-width label layout ══ */
  .imp-block{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .imp-label-text{font-size:.72rem; font-weight:700; color:var(--ink-mid); line-height:1.4;}
  .imp-row{display:flex; align-items:center; gap:10px;}
  .rank-label{font-size:.68rem; color:var(--ink-dim);}

  /* ══ Custom trait: own-written sides + add hint ══ */
  .sides-hint{font-size:.72rem; color:var(--ink-dim); line-height:1.6; margin-bottom:10px;}
  .side-input{
    width:100%; background:rgba(0,0,0,.18); border:1px solid var(--edge);
    border-radius:8px; padding:8px 10px; color:var(--ink);
    font-size:.78rem; font-family:var(--font-b); line-height:1.55;
    resize:vertical; min-height:62px;
  }
  .side-input:focus{border-color:var(--amber); outline:none;}
  .side-input::placeholder{color:var(--ink-dim);}
  .add-hint{font-size:.74rem; color:var(--ink-dim); line-height:1.6; margin-top:9px;}
  .add-hint.known{color:var(--good);}

  /* ══ Portrait note display ══ */
  .pt-note{
    font-size:.73rem; color:var(--ink-mid); line-height:1.55; margin-top:5px;
    padding:8px 11px; background:var(--bg-card-2); border-radius:8px;
    border-right:2px solid var(--amber-dim); white-space:pre-wrap; word-break:break-word;
  }

  /* ══ Share button & toast ══ */
  .share-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; margin-top:14px; padding:14px;
    background:linear-gradient(165deg,var(--bg-card-2),var(--bg-card));
    border:1px solid var(--edge-warm); border-radius:var(--r-card);
    color:var(--amber); font-weight:700; font-size:.88rem; transition:.2s;
  }
  .share-btn:hover{background:var(--amber-glow); border-color:var(--amber);}
  .share-toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:#2a2d1e; border:1px solid rgba(140,180,60,.4); color:#b8e068;
    padding:11px 20px; border-radius:999px; font-size:.82rem; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.5); z-index:100;
    animation:toastIn .25s ease, toastOut .3s ease 1.8s forwards;
    white-space:nowrap;
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  @keyframes toastOut{from{opacity:1;}to{opacity:0;}}

  /* ══ Misc ══ */
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-dim); font-size:.85rem; line-height:1.7;
  }
  footer{
    border-top:1px solid var(--edge); padding:20px 18px; text-align:center;
    font-size:.68rem; color:var(--ink-dim); width:100%;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js" crossorigin></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

/* ═══════════════════════════════════════════════
   1. נתוני המזלות — תכונות עם אור, צל ושאלה
   ═══════════════════════════════════════════════ */
const ELEMENT_EMOJI = { "אש":"🔥", "אדמה":"🌱", "אוויר":"💨", "מים":"💧" };
const QUALITY_DESC  = {
  "יוזם":  "פותח עונות ומצבים חדשים — אנרגיה של התחלות",
  "יציב":  "מעמיק ומתמיד — אנרגיה של בנייה",
  "משתנה": "מגשר ומסתגל — אנרגיה של שינוי",
};

const ZODIAC_DATA = [
  {
    id:"aries", name:"טלה", symbol:"♈", dates:"21.3 – 19.4",
    element:"אש", rulingPlanet:"מאדים", quality:"יוזם",
    tagline:"ראשון/ה לקפוץ, ראשון/ה לסמן דרך — הטלה נולד/ה מוכן/ה לפעולה.",
    traits:[
      { id:"aries_courage", name:"אומץ לב",
        light:"יוצאים לדרך בלי לחכות שמישהו יתן רשות. נוכחות שלך בחדר מעודדת אחרים לנסות.",
        shadow:"לפעמים הדחף לפעולה מקדים את ההבנה של הסיכון האמיתי שבמצב.",
        q:"מתי האומץ שלך שירת אותך טוב — ומתי הוא הוביל אותך למקום שלא ציפית?" },
      { id:"aries_initiative", name:"יוזמה",
        light:"רואים צורך ופועלים — בלי להמתין לאישור. זה נדיר ויקר ערך.",
        shadow:"יכול להיראות כאילו 'גוזלים' מאחרים את ההזדמנות לתרום.",
        q:"האם יש תחום בחייך שבו אתה/ת יוזם/ת פחות ממה שהיית רוצה?" },
      { id:"aries_impulsive", name:"אימפולסיביות",
        light:"תגובה מיידית ואינסטינקטיבית שמצילה מצבים ומביאה אנרגיה טרייה.",
        shadow:"החלטות שנעשות בשנייה יכולות לעלות ביוקר אחר כך.",
        q:"האם ישנן החלטות שבהסתכלות לאחור היית בוחר/ת לחכות?" },
      { id:"aries_leadership", name:"מנהיגות",
        light:"אנשים מרגישים בטוחים ללכת אחריך כי אתה/ת נושא/ת בנטל של ההחלטה.",
        shadow:"קשה לתת לאחרים להוביל, גם כשהם יכולים לעשות זאת טוב ממך.",
        q:"מה קורה בך כשמישהו אחר לוקח את ההגה במצב שאתה/ת רגיל/ה להיות המוביל/ה בו?" }
    ]

function normalizeTraitName(s){
  return (s || "").replace(/["'׳״]/g, "").replace(/\s+/g, " ").trim();
}
const TRAIT_LOOKUP = (() => {
  const m = {};
  TRAIT_LIBRARY.forEach(t => t.names.forEach(n => { m[normalizeTraitName(n)] = t; }));
  return m;
})();

/* תכונה שהמשתמש הוסיף -> אובייקט עם light/shadow/q.
   אם יש בספרייה: הטקסט מהספרייה. אם לא: מה שהמשתמש כתב בעצמו + שאלה כללית. */
function resolveCustomTrait(c){
  const lib = TRAIT_LOOKUP[normalizeTraitName(c.name)];
  if (lib) return { ...c, isCustom: true, fromLibrary: true, light: lib.light, shadow: lib.shadow, q: lib.q };
  return {
    ...c, isCustom: true, fromLibrary: false,
    light: c.light || "", shadow: c.shadow || "",
    q: `מתי התכונה "${c.name}" שירתה אותך טוב — ומתי הובילה אותך למקום שלא ציפית?`
  };
}

function zodiacForDate(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  if (!m || !d) return null;
  const ranges = [
    ["aries",(m===3&&d>=21)||(m===4&&d<=19)],
    ["taurus",(m===4&&d>=20)||(m===5&&d<=20)],
    ["gemini",(m===5&&d>=21)||(m===6&&d<=20)],
    ["cancer",(m===6&&d>=21)||(m===7&&d<=22)],
    ["leo",(m===7&&d>=23)||(m===8&&d<=22)],
    ["virgo",(m===8&&d>=23)||(m===9&&d<=22)],
    ["libra",(m===9&&d>=23)||(m===10&&d<=22)],
    ["scorpio",(m===10&&d>=23)||(m===11&&d<=21)],
    ["sagittarius",(m===11&&d>=22)||(m===12&&d<=21)],
    ["capricorn",(m===12&&d>=22)||(m===1&&d<=19)],
    ["aquarius",(m===1&&d>=20)||(m===2&&d<=18)],
    ["pisces",(m===2&&d>=19)||(m===3&&d<=20)],
  ];
  const found = ranges.find(([,cond])=>cond);
  return found ? zodiacIndex[found[0]] : null;
}

const LS_KEY = "zodiac_self_v1";
function loadProfile() {
  try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch { return null; }
}
function saveProfile(p) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch {}
}

/* ═══════════════════════════════════════
   4. Star Rating component
   ═══════════════════════════════════════ */
function Stars({ value, onChange, label, max = 5 }) {
  const [hover, setHover] = useState(null);
  return (
    <div className="control-row">
      <span className="control-label">{label}</span>
      <div className="stars" role="group" aria-label={label}>
        {Array.from({length: max}, (_, i) => max - i).map(n => (
          <button key={n} className={`star ${(hover ?? value) >= n ? "on" : ""}`}
            onClick={() => onChange(n)}
            onMouseEnter={() => setHover(n)}
            onMouseLeave={() => setHover(null)}
            aria-label={`${n} מתוך ${max}`}>★</button>
        ))}
      </div>
    </div>
  );
}

   5. Importance Pips (1–5 bar)
   ═══════════════════════════════════════ */
const IMP_LABELS = ["", "נמוכה", "בינונית", "חשובה", "מאוד חשובה", "מרכזית בחיי"];
function ImportancePips({ value, onChange }) {
  return (
    <div className="imp-block">
      <span className="imp-label-text">עד כמה חשובה עבורי התכונה הזו</span>
      <div className="imp-row">
        <div className="rank-pill">
          {[1,2,3,4,5].map(n => (
            <button key={n} className={`rank-pip ${value >= n ? "on" : ""}`}
              onClick={() => onChange(value === n ? 0 : n)}
              aria-label={`חשיבות ${n}`}/>
          ))}
        </div>
        {value > 0
          ? <span className="rank-label">{IMP_LABELS[value]}</span>
          : <span className="rank-label" style={{fontStyle:"italic"}}>לחצ/י לדירוג</span>
        }
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   6. TraitCard
   ═══════════════════════════════════════ */
function TraitCard({ trait, isCustom, rating, importance, note, onRate, onImport, onNote, onDelete, onEditSide }) {
  const ownSides = isCustom && !trait.fromLibrary; // תכונה שאין לה ניסוח מוכן — המשתמש מנסח
  return (
    <div className={`trait-card ${importance >= 4 ? "ranked" : ""}`}>
      <div className="tc-top">
        <div>
          <div className="tc-name">{trait.name}</div>
          {isCustom && <span className="tc-custom-tag">הוספתי בעצמי</span>}
        </div>
        {isCustom && (
          <button className="tc-del" onClick={onDelete} aria-label="מחק תכונה">✕</button>
        )}
      </div>

      {ownSides ? (
        <>
          <p className="sides-hint">אין לנו עדיין ניסוח מוכן לתכונה הזו, אז אפשר לנסח אותו בעצמך. כל שדה אופציונלי.</p>
          <div className="trait-sides">
            <div className="side light">
              <div className="side-label">✦ כשזה עובד לטובתי</div>
              <textarea className="side-input" value={trait.light || ""} maxLength={300}
                onChange={e => onEditSide("light", e.target.value)}
                placeholder="מתי התכונה הזו עוזרת לי? מה היא מאפשרת לי?"/>
            </div>
            <div className="side shadow">
              <div className="side-label">◈ הצד השני</div>
              <textarea className="side-input" value={trait.shadow || ""} maxLength={300}
                onChange={e => onEditSide("shadow", e.target.value)}
                placeholder="מתי התכונה הזו מקשה עלי או על הסובבים אותי?"/>
            </div>
          </div>
        </>
      ) : (
        <div className="trait-sides">
          <div className="side light">
            <div className="side-label">✦ כשזה עובד</div>
            <p>{trait.light}</p>
          </div>
          <div className="side shadow">
            <div className="side-label">◈ הצד השני</div>
            <p>{trait.shadow}</p>
          </div>
        </div>
      )}
      {trait.q && (
        <div className="tc-question">
          <p>💭 {trait.q}</p>
        </div>
      )}

      <div className="tc-controls">
        <Stars value={rating} onChange={onRate}
          label={isCustom ? "עד כמה נוכחת בי" : "עד כמה מזהה בעצמי"} />
        <ImportancePips value={importance} onChange={onImport} />
      </div>

      <div className="tc-note-wrap">
        <div className="tc-note-label">✏️ המחשבות שלי על תכונה זו</div>
        <textarea
          className="tc-note-area"
          value={note || ""}
          onChange={e => onNote(e.target.value)}
          placeholder={isCustom
            ? "כתוב/י כאן כל מה שעולה לך על התכונה הזו בחייך…"
            : "כתוב/י כאן מחשבה אישית, דוגמה מחייך, או תגובה לשאלה למעלה…"}
          maxLength={600}
        />
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   7. AddTraitForm
   ═══════════════════════════════════════ */
function AddTraitForm({ onAdd, onCancel }) {
  const [name, setName] = useState("");
  const valid = name.trim().length >= 2;
  const known = valid && !!TRAIT_LOOKUP[normalizeTraitName(name)];
  return (
    <div className="add-form">
      <label style={{display:"block", fontSize:".78rem", fontWeight:700, color:"var(--ink-mid)", marginBottom:8}}>
        שם התכונה
      </label>
      <input
        autoFocus value={name} onChange={e => setName(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter" && valid) onAdd(name.trim()); if (e.key === "Escape") onCancel(); }}
        placeholder="למשל: יצירתיות, סבלנות, אמינות…"
        maxLength={40}
      />
      {valid && (
        <p className={`add-hint ${known ? "known" : ""}`}>
          {known
            ? "✓ יש לנו פירוט מוכן לתכונה הזו: כשזה עובד, הצד השני ושאלה לחשיבה."
            : "אין לנו ניסוח מוכן לתכונה הזו. אחרי ההוספה אפשר לנסח בעצמך את שני הצדדים שלה."}
        </p>
      )}
      <div className="add-form-row">
        <button className="confirm-add" disabled={!valid} onClick={() => onAdd(name.trim())}>הוסף תכונה</button>
        <button className="cancel-add" onClick={onCancel}>ביטול</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   8. Portrait (tab 3)
   ═══════════════════════════════════════ */
function Portrait({ zodiac, profile }) {
  const [toast, setToast] = useState(null);

  const allTraits = [
    ...zodiac.traits.map(t => ({
      id: t.id, name: t.name,
      rating: profile.ratings[t.id] || 0,
      importance: profile.importance[t.id] || 0,
      note: (profile.notes || {})[t.id] || "",
    })),
    ...(profile.customTraits || []).map(c => ({
      id: c.id, name: c.name,
      rating: profile.ratings[c.id] || 0,
      importance: profile.importance[c.id] || 0,
      note: (profile.notes || {})[c.id] || "",
    }))
  ];

  const sorted = [...allTraits].sort((a, b) => {
    if (b.importance !== a.importance) return b.importance - a.importance;
    return b.rating - a.rating;
  });

  const ratedCount = allTraits.filter(t => t.rating > 0).length;
  const avgRating = ratedCount > 0
    ? (allTraits.reduce((s, t) => s + t.rating, 0) / ratedCount).toFixed(1)
    : "—";

  const topTrait = sorted.find(t => t.rating > 0 || t.importance > 0);
  const el = zodiac.element;

  const buildShareText = () => {
    const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
    const lines = [
      `✦ הפרופיל שלי — מזל ${zodiac.name} ${zodiac.symbol}`,
      `${ELEMENT_EMOJI[el]} יסוד ${el} · ${zodiac.rulingPlanet} · ${zodiac.quality}`,
      `"${zodiac.tagline}"`,
      ``,
      `התכונות שלי לפי סדר חשיבות:`,
    ];
    sorted.forEach((t, i) => {
      const imp = t.importance > 0 ? IMP_LABELS[t.importance] : "לא דורג";
      const rat = t.rating > 0 ? stars(t.rating) : "—";
      lines.push(`${i + 1}. ${t.name}`);
      lines.push(`   נוכחות: ${rat} | חשיבות: ${imp}`);
      if (t.note) lines.push(`   "${t.note.trim()}"`);
    });
    lines.push(``);
    lines.push(`נבנה עם האפליקציה "מזלות"`);
    return lines.join("\n");
  };

  const handleShare = async () => {
    const text = buildShareText();
    if (navigator.share) {
      try {
        await navigator.share({ title: `הפרופיל שלי — מזל ${zodiac.name}`, text });
        return;
      } catch {}
    }
    try {
      await navigator.clipboard.writeText(text);
      setToast("הפרופיל הועתק ללוח ✓");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      setToast("הפרופיל הועתק ללוח ✓");
    }
    setTimeout(() => setToast(null), 2200);
  };

  return (
    <div>
      {toast && <div className="share-toast">{toast}</div>}

      <div className="portrait-hero">
        <div className="sym">{zodiac.symbol}</div>
        <h2>מזל {zodiac.name}</h2>
        <div className="sub">{ELEMENT_EMOJI[el]} {el} · {zodiac.rulingPlanet} · {QUALITY_DESC[zodiac.quality]}</div>
      </div>

      <div className="portrait-grid">
        <div className="pg-card">
          <div className="pg-label">תכונות שדירגתי</div>
          <div className="pg-val">{ratedCount} / {allTraits.length}</div>
          <div className="pg-sub">ממוצע נוכחות: {avgRating}</div>
        </div>
        <div className="pg-card">
          <div className="pg-label">הוספתי בעצמי</div>
          <div className="pg-val">{(profile.customTraits || []).length} תכונות</div>
          <div className="pg-sub">מעבר למה שהמזל מציע</div>
        </div>
        {topTrait && (
          <div className="pg-card" style={{gridColumn:"span 2"}}>
            <div className="pg-label">התכונה המרכזית שלי</div>
            <div className="pg-val">{topTrait.name}</div>
            <div className="pg-sub">לפי דירוג החשיבות שלי</div>
          </div>
        )}
      </div>

      {sorted.length > 0 && (
        <div className="portrait-traits">
          <h3>הפרופיל שלי — לפי סדר חשיבות</h3>
          {sorted.map((t, i) => (
            <div key={t.id} className="pt-item" style={{flexDirection:"column", alignItems:"stretch"}}>
              <div style={{display:"flex", alignItems:"center", gap:12}}>
                <div className="pt-rank">{i + 1}</div>
                <div className="pt-info">
                  <div className="pt-name">{t.name}</div>
                  <div className="pt-meta">
                    {t.importance > 0 ? IMP_LABELS[t.importance] : "חשיבות: לא דורגה"} ·{" "}
                    {t.rating > 0 ? `נוכחות ${t.rating}/5` : "נוכחות: לא דורגה"}
                  </div>
                </div>
                <div className="pt-stars">
                  {[5,4,3,2,1].map(n => (
                    <span key={n} className={`pt-star ${t.rating >= n ? "on" : ""}`}>★</span>
                  ))}
                </div>
              </div>
              {t.note && <div className="pt-note">{t.note}</div>}
            </div>
          ))}
        </div>
      )}

      <div className="portrait-cta">
        <p><b>הפרופיל הזה הוא שלך.</b> המזל מציע נקודת התחלה — אבל <b>אתה/ת זה/ו שמגדיר/ה</b> כמה כל תכונה נוכחת בחיים שלך ועד כמה היא חשובה לך. אפשר לחזור ולעדכן בכל עת.</p>
      </div>

      <button className="share-btn" onClick={handleShare}>
        ✦ שתף/י את הפרופיל שלי
      </button>
    </div>
  );
}

/* ═══════════════════════════════════════
   9. App
   ═══════════════════════════════════════ */
const TABS = ["גילוי המזל", "תכונות שלי", "הפרופיל שלי"];

function App() {
  const [birthdate, setBirthdate] = useState("");
  const [tab, setTab] = useState(0);
  const [showAddForm, setShowAddForm] = useState(false);
  const [profile, setProfile] = useState(() => loadProfile() || {
    birthdate: null,
    zodiacId: null,
    ratings: {},
    importance: {},
    notes: {},
    customTraits: [],
  });

  const zodiac = profile.zodiacId ? zodiacIndex[profile.zodiacId] : null;
  const discovered = !!zodiac;

  useEffect(() => { saveProfile(profile); }, [profile]);

  const handleDiscover = () => {
    const z = zodiacForDate(birthdate);
    if (!z) return;
    setProfile(p => ({ ...p, birthdate, zodiacId: z.id }));
    setTab(1);
  };

  const updateRating = (traitId, val) =>
    setProfile(p => ({ ...p, ratings: { ...p.ratings, [traitId]: val } }));

  const updateImportance = (traitId, val) =>
    setProfile(p => ({ ...p, importance: { ...p.importance, [traitId]: val } }));

  const updateNote = (traitId, val) =>
    setProfile(p => ({ ...p, notes: { ...(p.notes || {}), [traitId]: val } }));

  const addCustom = (name) => {
    const id = "custom_" + Date.now();
    setProfile(p => ({ ...p, customTraits: [...(p.customTraits || []), { id, name }] }));
    setShowAddForm(false);
  };

  const editCustomSide = (id, field, val) =>
    setProfile(p => ({
      ...p,
      customTraits: (p.customTraits || []).map(c => c.id === id ? { ...c, [field]: val } : c)
    }));

  const deleteCustom = (id) =>
    setProfile(p => ({ ...p, customTraits: (p.customTraits || []).filter(c => c.id !== id) }));

  const reset = () => {
    if (!window.confirm("למחוק את כל הפרופיל ולהתחיל מחדש?")) return;
    setProfile({ birthdate: null, zodiacId: null, ratings: {}, importance: {}, notes: {}, customTraits: [] });
    setBirthdate("");
    setTab(0);
  };

  const allTraitsForTab = zodiac ? [
    ...zodiac.traits,
    ...(profile.customTraits || []).map(resolveCustomTrait)
  ] : [];

  return (
    <div className="shell">
      <header className="top">
        <div className="top-brand">
          <span className="sym">{zodiac ? zodiac.symbol : "✦"}</span>
          <div>
            <h1>מזלות</h1>
            <p>מסע גילוי עצמי דרך תכונות האופי</p>
          </div>
        </div>
        <div className="top-right">
          {discovered && <button className="ghost" onClick={reset}>התחל מחדש</button>}
        </div>
      </header>

      <div className="page">
        {discovered && (
          <div className="tab-bar">
            {TABS.map((t, i) => (
              <button key={t} className={`tab ${tab === i ? "active" : ""}`}
                onClick={() => setTab(i)}
                disabled={i === 2 && Object.keys(profile.ratings).length === 0}>
                {t}
              </button>
            ))}
          </div>
        )}

        {/* ── Tab 0: Intro / Reveal ── */}
        {(!discovered || tab === 0) && !discovered && (
          <div className="intro-wrap">
            <div className="intro-symbol">✦</div>
            <h2>המזל שלי</h2>
            <p>הזן/י את תאריך הלידה שלך ונגלה יחד אילו תכונות אופי משויכות למזל שלך — ותוכל/י לדרג אותן, להוסיף תכונות משלך ולבנות פרופיל אישי.</p>
            <div className="date-box">
              <label>תאריך לידה</label>
              <input className="date-input" type="date" value={birthdate}
                onChange={e => setBirthdate(e.target.value)}
                max={new Date().toISOString().split("T")[0]}/>
              <button className="big-btn" onClick={handleDiscover}
                disabled={!birthdate || !zodiacForDate(birthdate)}>
                גלה/י את המזל שלי ←
              </button>
            </div>
          </div>
        )}

        {discovered && tab === 0 && (
          <div className="reveal-wrap">
            <div className="reveal-sym">{zodiac.symbol}</div>
            <div className="reveal-el">{ELEMENT_EMOJI[zodiac.element]} יסוד {zodiac.element}</div>
            <h2>מזל {zodiac.name}</h2>
            <p className="dates-sub">{zodiac.dates}</p>
            <blockquote className="reveal-tagline">{zodiac.tagline}</blockquote>
            <div className="reveal-chips">
              <span className="chip">כוכב שליט <strong>{zodiac.rulingPlanet}</strong></span>
              <span className="chip">איכות <strong>{zodiac.quality}</strong></span>
              <span className="chip">יסוד <strong>{zodiac.element}</strong></span>
            </div>
            <button className="big-btn" style={{maxWidth:320, margin:"0 auto"}} onClick={() => setTab(1)}>
              גלה/י את התכונות שלי ←
            </button>
          </div>
        )}

        {/* ── Tab 1: Traits ── */}
        {discovered && tab === 1 && (
          <div>
            <div className="section-head">
              <h3>תכונות מזל {zodiac.name}</h3>
              <p>דרג/י כל תכונה לפי כמה היא נוכחת בך ועד כמה היא חשובה לך</p>
            </div>

            {allTraitsForTab.map(trait => (
              <TraitCard key={trait.id} trait={trait} isCustom={!!trait.isCustom}
                rating={profile.ratings[trait.id] || 0}
                importance={profile.importance[trait.id] || 0}
                note={(profile.notes || {})[trait.id] || ""}
                onRate={v => updateRating(trait.id, v)}
                onImport={v => updateImportance(trait.id, v)}
                onNote={v => updateNote(trait.id, v)}
                onEditSide={(field, v) => editCustomSide(trait.id, field, v)}
                onDelete={() => deleteCustom(trait.id)}/>
            ))}

            {showAddForm
              ? <AddTraitForm onAdd={addCustom} onCancel={() => setShowAddForm(false)}/>
              : <button className="add-trait-btn" onClick={() => setShowAddForm(true)}>
                  + הוסף תכונה שמאפיינת אותי
                </button>
            }

            {Object.keys(profile.ratings).length >= 2 && (
              <button className="big-btn" style={{marginTop:22}} onClick={() => setTab(2)}>
                צפה/י בפרופיל שלי ←
              </button>
            )}
          </div>
        )}

        {/* ── Tab 2: Portrait ── */}
        {discovered && tab === 2 && (
          <Portrait zodiac={zodiac} profile={profile}/>
        )}
      </div>

      <footer>
        <p>מזלות · פרופיל אישי נשמר על המכשיר שלך בלבד</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
