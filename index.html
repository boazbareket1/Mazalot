<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>מזלות — מסע גילוי עצמי</title>
<!--
  מזלות — מסע גילוי עצמי
  קובץ HTML עצמאי. מצב נשמר ב-localStorage.

  מבנה הקובץ:
  1. <style>     — עיצוב: לוח ענבר-כחול-כהה, גופן David Libre + Heebo.
  2. ZODIAC_DATA — 12 מזלות, כל אחד עם 4 תכונות מרכזיות + 4 נוספות (EXTRA_TRAITS) שנחשפות בכפתור.
  3. zodiacForDate() — חישוב מזל מדויק לפי יום+חודש.
  4. Screen components: Intro → Reveal → Traits → Portrait.
  5. localStorage — שמירת פרופיל אוטומטית.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;700&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #1c2236;
    --bg-card:   #283049;
    --bg-card-2: #323c5a;
    --edge:      rgba(255,255,255,.18);
    --edge-warm: rgba(235,195,110,.45);
    --amber:     #f0bc55;
    --amber-dim: #9a6e26;
    --amber-glow:rgba(212,160,67,.18);
    --sky:       #5b8fc4;
    --sky-dim:   rgba(91,143,196,.15);
    --ink:       #fbf8f1;
    --ink-mid:   #d3d0c8;
    --ink-dim:   #a9a69e;
    --good:      #7bc080;
    --bad:       #8f5c5c;
    --r-card:    20px;
    --r-sm:      12px;
    --font-h:    'David Libre', serif;
    --font-b:    'Heebo', sans-serif;
    --transition:.3s cubic-bezier(.4,.1,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-b);}
  h1,h2,h3,.serif{font-family:var(--font-h);}
  button{font-family:var(--font-b); cursor:pointer;}
  ::selection{background:var(--amber-glow); color:var(--ink);}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber); outline-offset:3px; border-radius:8px;}
  input:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  /* ══ Layout ══ */
  .shell{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  .page{width:100%; max-width:640px; padding:0 18px 80px; flex:1;}
  header.top{
    position:sticky; top:0; z-index:40; width:100%;
    background:rgba(15,17,24,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--edge); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .top-brand{display:flex; align-items:center; gap:10px;}
  .top-brand .sym{font-size:1.5rem; line-height:1;}
  .top-brand h1{font-size:1rem; font-weight:700; color:var(--ink);}
  .top-brand p{font-size:.68rem; color:var(--ink-mid); margin-top:1px;}
  .top-right{display:flex; gap:8px; align-items:center;}
  .ghost{
    background:transparent; border:1px solid var(--edge); color:var(--ink-mid);
    padding:7px 14px; border-radius:999px; font-size:.74rem; font-weight:600; transition:.2s;
  }
  .ghost:hover{border-color:var(--amber); color:var(--amber);}
  .tab-bar{
    display:flex; border-bottom:1px solid var(--edge); margin-bottom:26px;
  }
  .tab{
    flex:1; padding:14px 6px; font-size:.78rem; font-weight:600; text-align:center;
    background:transparent; border:none; color:var(--ink-dim); position:relative; transition:.2s;
  }
  .tab.active{color:var(--amber);}
  .tab.active::after{
    content:''; position:absolute; bottom:-1px; left:15%; right:15%; height:2px;
    background:var(--amber); border-radius:2px 2px 0 0;
  }
  .tab:disabled{opacity:.5; cursor:default;}

  /* ══ Intro screen ══ */
  .intro-wrap{
    display:flex; flex-direction:column; align-items:center;
    padding-top:60px; text-align:center; gap:0;
  }
  .intro-symbol{
    font-size:5rem; line-height:1; margin-bottom:28px;
    animation:floatY 4s ease-in-out infinite;
  }
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @media (prefers-reduced-motion:reduce){.intro-symbol{animation:none;}}
  .intro-wrap h2{font-size:2rem; font-weight:700; color:var(--ink); line-height:1.2; margin-bottom:10px;}
  .intro-wrap p{font-size:.95rem; color:var(--ink-mid); line-height:1.7; max-width:380px; margin:0 auto 36px;}
  .date-box{
    width:100%; max-width:340px; background:var(--bg-card);
    border:1px solid var(--edge-warm); border-radius:var(--r-card); padding:26px 22px;
  }
  .date-box label{display:block; font-size:.78rem; font-weight:700; color:var(--ink-mid); margin-bottom:8px; text-align:right;}
  .date-input{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:13px 14px; color:var(--ink);
    font-size:1rem; font-family:var(--font-b); text-align:center; transition:.2s;
  }
  .date-input:hover{border-color:var(--edge-warm);}
  .love-card{display:flex; gap:16px; align-items:center; background:var(--bg-card); border:1px solid var(--edge-warm); border-radius:var(--r-card); padding:18px; margin-bottom:16px;}
  .love-sym{font-size:2.6rem; color:var(--amber); line-height:1;}
  .love-rows p{font-size:.86rem; line-height:1.7; color:var(--ink-mid);}
  .love-rows strong, .match-two strong, .rec-need strong{color:var(--ink);}
  .mode-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .mode-btn{flex:1; min-width:150px; background:var(--bg-card); border:1px solid var(--edge); color:var(--ink-mid); padding:13px 10px; border-radius:var(--r-sm); font-size:.88rem; font-weight:700; transition:.2s;}
  .mode-btn.on, .mode-btn:hover{border-color:var(--amber); color:var(--amber);}
  .love-panel{background:var(--bg-card); border:1px solid var(--edge); border-radius:var(--r-card); padding:18px; margin-bottom:16px;}
  .lp-h{font-weight:700; margin-bottom:12px; font-size:.95rem;}
  .lp-or{font-size:.78rem; color:var(--ink-mid); margin:16px 0 10px;}
  .sign-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px;}
  .sign-chip{display:flex; align-items:center; justify-content:center; gap:6px; background:var(--bg-card-2); border:1px solid var(--edge); color:var(--ink-mid); padding:9px 6px; border-radius:var(--r-sm); font-size:.82rem; font-weight:600; transition:.2s;}
  .sign-chip.on, button.sign-chip:hover{border-color:var(--amber); color:var(--amber);}
  .sign-chip.static{opacity:.8;}
  .sc-sym{font-size:1.05rem;}
  .match-result, .rec-card{background:var(--bg-card-2); border:1px solid var(--edge-warm); border-radius:var(--r-sm); padding:16px; margin-top:16px; text-align:center;}
  .rec-card{text-align:right; margin-top:10px;}
  .match-result p, .rec-card p{font-size:.84rem; line-height:1.7; color:var(--ink-mid); margin-top:8px;}
  .match-pair{display:flex; justify-content:center; align-items:center; gap:14px; font-size:1.1rem; font-weight:700;}
  .heart{color:#d98a8a;}
  .match-stars, .rec-stars{color:var(--amber); letter-spacing:2px; margin-top:6px;}
  .match-kind{font-size:.8rem; font-weight:700; color:var(--amber); margin-top:4px;}
  .rec-top{display:flex; justify-content:space-between; align-items:center;}
  .rec-name{font-size:1rem; font-weight:700;}
  .match-two{text-align:right; font-size:.82rem; line-height:1.7; color:var(--ink-mid); margin-top:12px; display:grid; gap:6px;}
  .love-note{font-size:.72rem; color:var(--ink-dim); line-height:1.6; text-align:center; margin:6px 0 10px;}
  .gift-card{background:var(--bg-card-2); border:1px solid var(--edge); border-radius:var(--r-sm); padding:14px 16px; margin:10px 0; text-align:right;}
  .gift-deep{font-size:.84rem; line-height:1.7; color:var(--ink-mid); margin-top:8px;}
  .bul{padding-right:18px; font-size:.85rem; line-height:1.75; color:var(--ink-mid); margin:4px 0;}
  .gift-head{font-weight:700; color:var(--amber); font-size:.9rem; margin-bottom:6px;}
  .gift-card ul{padding-right:18px; font-size:.84rem; line-height:1.7; color:var(--ink-mid);}
  .m-sections{margin-top:16px; text-align:right;}
  .m-block{border-top:1px solid var(--edge); padding-top:14px; margin-top:14px;}
  .m-block h4{font-size:.92rem; font-weight:700; color:var(--amber); margin-bottom:6px;}
  .m-block p{font-size:.85rem !important; line-height:1.75; color:var(--ink-mid); margin-top:6px;}
  .m-block strong{color:var(--ink);}
  .lp-sub{font-size:.78rem; color:var(--ink-mid); margin:-6px 0 8px; line-height:1.6;}
  .rec-card.soft{opacity:.92;}
  .rec-card .rec-need{margin-top:6px;}
  .date-fields{display:flex; gap:10px;}
  .date-field{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .date-field.wide{flex:1.5;}
  .date-field-label{font-size:.7rem; font-weight:700; color:var(--ink-dim); text-align:center;}
  .date-fields .date-input{padding:13px 4px; font-size:1.15rem; letter-spacing:1px;}
  .date-fields .date-input::placeholder{color:var(--ink-dim); opacity:.7;}
  .date-error{font-size:.76rem; color:#d98a8a; line-height:1.55; margin-top:12px; text-align:center;}
  .big-btn{
    display:block; width:100%; margin-top:14px;
    background:var(--amber); color:#1c1204; border:none;
    padding:15px; border-radius:var(--r-sm); font-weight:800; font-size:.95rem; transition:.2s;
  }
  .big-btn:hover{filter:brightness(1.08);}
  .big-btn:disabled{opacity:.6; cursor:default;}

  /* ══ Reveal screen ══ */
  .reveal-wrap{padding-top:40px; text-align:center;}
  .reveal-sym{
    font-size:5.5rem; line-height:1; margin-bottom:6px;
    color:var(--amber); text-shadow:0 0 40px rgba(212,160,67,.4);
  }
  .reveal-el{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--amber-glow); border:1px solid var(--edge-warm);
    border-radius:999px; padding:5px 14px; margin-bottom:24px;
    font-size:.8rem; font-weight:700; color:var(--amber);
  }
  .reveal-wrap h2{font-size:1.9rem; font-weight:700; margin-bottom:6px;}
  .reveal-wrap .dates-sub{font-size:.85rem; color:var(--ink-mid); margin-bottom:20px;}
  .reveal-tagline{
    font-size:1.1rem; font-style:italic; color:var(--ink-mid); line-height:1.7;
    max-width:440px; margin:0 auto 28px; padding:20px 22px;
    border-right:3px solid var(--amber); text-align:right;
  }
  .reveal-chips{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    background:var(--bg-card); border:1px solid var(--edge);
    border-radius:999px; padding:7px 14px; font-size:.78rem; color:var(--ink-mid);
  }
  .chip strong{color:var(--ink);}

  /* ══ Traits screen ══ */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .section-head h3{font-size:1.2rem; font-weight:700;}
  .section-head p{font-size:.76rem; color:var(--ink-mid); text-align:left;}

  .trait-card{
    background:var(--bg-card); border:1px solid var(--edge);
    border-radius:var(--r-card); padding:20px 20px 16px; margin-bottom:14px;
    transition:border-color var(--transition);
  }
  .trait-card:hover{border-color:var(--edge-warm);}
  .trait-card.ranked{border-color:rgba(91,143,196,.35);}

  .tc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .tc-name{font-size:1.05rem; font-weight:800; color:var(--ink);}
  .tc-custom-tag{
    font-size:.62rem; font-weight:700; background:var(--sky-dim);
    border:1px solid rgba(91,143,196,.3); color:var(--sky);
    border-radius:999px; padding:3px 9px; white-space:nowrap; margin-top:3px;
  }

  .trait-sides{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  @media (max-width:500px){.trait-sides{grid-template-columns:1fr;}}
  .side{
    border-radius:var(--r-sm); padding:11px 13px;
  }
  .side.light{background:rgba(92,143,96,.1); border:1px solid rgba(92,143,96,.2);}
  .side.shadow{background:rgba(143,92,92,.1); border:1px solid rgba(143,92,92,.2);}
  .side-label{font-size:.62rem; font-weight:800; letter-spacing:.5px; margin-bottom:5px; text-transform:uppercase;}
  .side.light .side-label{color:var(--good);}
  .side.shadow .side-label{color:var(--bad);}
  .side p{font-size:.8rem; color:var(--ink-mid); line-height:1.55;}

  .tc-question{
    background:var(--sky-dim); border-right:3px solid var(--sky);
    border-radius:0 var(--r-sm) var(--r-sm) 0; padding:10px 13px; margin-bottom:14px;
  }
  .tc-question p{font-size:.78rem; color:var(--ink-mid); line-height:1.6; font-style:italic;}

  .tc-controls{display:flex; flex-direction:column; gap:10px;}
  .control-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .control-label{font-size:.72rem; font-weight:700; color:var(--ink-mid); white-space:nowrap; min-width:90px;}
  .stars{display:flex; gap:4px; flex-direction:row-reverse;}
  .star{
    font-size:1.3rem; cursor:pointer; line-height:1; color:var(--ink-dim); transition:.15s; background:none; border:none; padding:2px;
  }
  .star.on{color:var(--amber);}
  .star:hover{transform:scale(1.15);}

  .rank-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .rank-pill{
    display:flex; gap:1px;
  }
  .rank-pip{
    width:20px; height:7px; border-radius:2px; cursor:pointer;
    background:var(--bg-card-2); border:1px solid var(--edge); transition:.15s;
  }
  .rank-pip.on{background:var(--sky); border-color:rgba(91,143,196,.4);}

  .rank-label{font-size:.68rem; color:var(--ink-dim);}

  /* add trait */
  .add-trait-btn{
    width:100%; background:transparent; border:1px dashed var(--edge);
    border-radius:var(--r-card); padding:16px; color:var(--ink-mid);
    font-size:.82rem; font-weight:600; transition:.2s; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .add-trait-btn:hover{border-color:var(--amber); color:var(--amber);}

  .add-form{
    background:var(--bg-card); border:1px solid var(--edge-warm);
    border-radius:var(--r-card); padding:18px; margin-bottom:14px;
  }
  .add-form input{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:11px 13px; color:var(--ink);
    font-size:.9rem; font-family:var(--font-b);
  }
  .add-form-row{display:flex; gap:8px; margin-top:10px;}
  .add-form-row button{flex:1; padding:11px; border-radius:var(--r-sm); font-weight:700; font-size:.82rem; border:none; transition:.2s;}
  .confirm-add{background:var(--amber); color:#1c1204;}
  .cancel-add{background:var(--bg-card-2); color:var(--ink-mid); border:1px solid var(--edge) !important;}

  /* delete custom */
  .tc-del{
    background:transparent; border:none; color:var(--ink-dim); font-size:.9rem;
    padding:4px 6px; border-radius:6px; transition:.2s; flex-shrink:0;
  }
  .tc-del:hover{color:var(--bad); background:rgba(143,92,92,.12);}

  /* ══ Portrait screen ══ */
  .portrait-hero{
    background:linear-gradient(165deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--edge-warm); border-radius:var(--r-card);
    padding:26px 22px; text-align:center; margin-bottom:22px;
  }
  .portrait-hero .sym{font-size:3.5rem; margin-bottom:8px;}
  .portrait-hero h2{font-size:1.6rem; font-weight:700; margin-bottom:4px;}
  .portrait-hero .sub{font-size:.8rem; color:var(--ink-mid);}

  .portrait-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px;}
  @media(max-width:440px){.portrait-grid{grid-template-columns:1fr;}}
  .pg-card{
    background:var(--bg-card); border:1px solid var(--edge); border-radius:var(--r-card); padding:16px;
  }
  .pg-label{font-size:.66rem; font-weight:800; color:var(--ink-dim); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px;}
  .pg-val{font-size:1.1rem; font-weight:700; color:var(--ink);}
  .pg-sub{font-size:.72rem; color:var(--ink-mid); margin-top:3px; line-height:1.5;}

  .portrait-traits{margin-bottom:22px;}
  .portrait-traits h3{font-size:1.1rem; font-weight:700; margin-bottom:14px;}
  .pt-item{
    display:flex; align-items:center; gap:12px;
    padding:13px 16px; border-radius:var(--r-sm);
    background:var(--bg-card); border:1px solid var(--edge); margin-bottom:8px;
  }
  .pt-rank{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.82rem; font-weight:800; background:var(--amber-glow); color:var(--amber);
    border:1px solid var(--edge-warm);
  }
  .pt-info{flex:1;}
  .pt-name{font-weight:700; font-size:.9rem;}
  .pt-meta{font-size:.68rem; color:var(--ink-dim); margin-top:3px;}
  .pt-stars{display:flex; gap:2px; flex-direction:row-reverse;}
  .pt-star{font-size:.85rem; color:var(--ink-dim);}
  .pt-star.on{color:var(--amber);}

  .portrait-cta{
    background:var(--bg-card); border:1px solid var(--edge);
    border-radius:var(--r-card); padding:18px 20px; text-align:center; color:var(--ink-mid);
    font-size:.8rem; line-height:1.7;
  }
  .portrait-cta b{color:var(--ink);}

  /* ══ Personal note textarea ══ */
  .tc-note-wrap{margin-top:12px; border-top:1px solid var(--edge); padding-top:12px;}
  .tc-note-label{
    font-size:.7rem; font-weight:700; color:var(--ink-dim); margin-bottom:6px;
    display:flex; align-items:center; gap:5px;
  }
  .tc-note-area{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:11px 13px; color:var(--ink);
    font-size:.82rem; font-family:var(--font-b); line-height:1.6;
    resize:vertical; min-height:68px; transition:border-color .2s;
  }
  .tc-note-area:hover{border-color:var(--edge-warm);}
  .tc-note-area:focus{border-color:var(--amber); outline:none;}
  .tc-note-area::placeholder{color:var(--ink-dim);}

  /* ══ Importance — full-width label layout ══ */
  .imp-block{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .imp-label-text{font-size:.72rem; font-weight:700; color:var(--ink-mid); line-height:1.4;}
  .imp-row{display:flex; align-items:center; gap:10px;}
  .rank-label{font-size:.68rem; color:var(--ink-dim);}

  /* ══ Trait picker ══ */
  .add-actions{display:flex; flex-direction:column; gap:10px;}
  .extra-btn{margin:4px 0 18px; border-style:solid; border-color:var(--edge-warm); color:var(--amber);}
  .extra-block{margin:8px 0 18px;}
  .extra-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:6px 0 12px; color:var(--amber); font-weight:700; font-size:1rem;}
  .add-trait-btn.primary{
    border-style:solid; border-color:var(--edge-warm); color:var(--amber); background:var(--amber-glow);
  }
  .add-trait-btn.primary:hover{border-color:var(--amber);}
  .pick-panel{
    background:var(--bg-card); border:1px solid var(--edge-warm);
    border-radius:var(--r-card); padding:18px 16px 16px; margin-bottom:14px;
  }
  .pick-head-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .pick-title{font-size:1.02rem; font-weight:700;}
  .pick-sub{font-size:.74rem; color:var(--ink-mid); line-height:1.65; margin-bottom:12px;}
  .pick-search{
    width:100%; background:var(--bg-card-2); border:1px solid var(--edge);
    border-radius:var(--r-sm); padding:11px 13px; color:var(--ink);
    font-size:.88rem; font-family:var(--font-b);
  }
  .pick-search:focus{border-color:var(--amber); outline:none;}
  .pick-cats{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0;}
  .pick-cat{
    background:transparent; border:1px solid var(--edge); color:var(--ink-mid);
    padding:6px 12px; border-radius:999px; font-size:.7rem; font-weight:600; transition:.2s;
  }
  .pick-cat:hover{border-color:var(--amber); color:var(--amber);}

    light:"שואלים 'למה' מול כללים ומתנגדים לעוול, וזה מוביל לשינוי.",
    shadow:"התנגדות אוטומטית עלולה למנוע שיתוף פעולה גם כשהכלל מועיל.",
    q:"לאיזה כלל התנגדת — ומה היה מאחורי ההתנגדות?" },
];

function normalizeTraitName(s){
  return (s || "").replace(/["'׳״]/g, "").replace(/\s+/g, " ").trim();
}
/* חיפוש לפי שם: קודם הספרייה (כולל כינויים), ואחריה תכונות כל 12 המזלות
   (שמות מדויקים של תכונות מזל גוברים, כי יש להן ניסוח מלא משלהן) */
const TRAIT_LOOKUP = (() => {
  const m = {};
  TRAIT_LIBRARY.forEach(t => t.names.forEach(n => { m[normalizeTraitName(n)] = t; }));
  ZODIAC_DATA.forEach(z => [...z.traits, ...z.extraTraits].forEach(t => { m[normalizeTraitName(t.name)] = t; }));
  return m;
})();

/* חלוקה לקטגוריות לבורר התכונות. תכונה שלא מופיעה כאן נכנסת ל"ערכים ואופי". */
const TRAIT_CATEGORIES = [
  { id:"emotion", label:"רגש ועולם פנימי", members:[
    "רגישות","מופנמות","ביטחון עצמי","דרמטיות","טוטאליות","סודיות","עומק רגשי","אופטימיות",
    "אמפתיה","רגישות גבוהה","אהבת נוחות וטבע","רוגע","התלהבות","אינטואיציה","מודעות עצמית",
    "הכרת תודה","חדוות חיים","חמימות","פתיחות רגשית","גאווה",
    "זיכרון רגשי","מצבי רוח משתנים","חושניות","ריחוק רגשי","קנאה","נטייה לחלום בהקיץ","כוח התחדשות" ] },
  { id:"social", label:"קשר עם אחרים", members:[
    "מנהיגות","תקשורתיות","כושר ביטוי","דאגה לזולת","מחובר/ת למשפחה","אהבת תשומת לב","רצון לעזור",
    "הרמוניה","חברותיות","מגנטיות","חוש הומור","הקשבה","אכפתיות","חמלה","סובלנות","שיתוף פעולה",
    "אסרטיביות","הכלה","רצון לרצות","מסירות",
    "דיפלומטיות","הגנתיות","שנינות","קלילות","רכושנות","קושי בהצבת גבולות","הומור יבש" ] },
  { id:"mind", label:"חשיבה ויצירה", members:[
    "סקרנות","חשיבה אנליטית","קושי בהכרעה","מקוריות","חשיבה מחוץ לקופסה","דמיון מפותח","יצירתיות",
    "ביקורתיות","ספקנות","שיקול דעת","פתיחות לחוויות חדשות","ראייה כוללת","ריכוז ומיקוד","חדות מחשבה",
    "פיזור","ראייה חודרת","ראייה עתידנית","אהבת למידה","חוש אסתטי","אהבת יופי","נפש אמנותית" ] },
  { id:"action", label:"עשייה והתמדה", members:[
    "אומץ לב","יוזמה","אימפולסיביות","עקשנות","יציבות","שינויים תכופים","פרפקציוניזם","סדר וארגון",
    "אהבת חופש והרפתקאות","שאפתנות","חריצות","רצינות ומעשיות","משמעת","גמישות","התמדה","ספונטניות",
    "זהירות","נחישות","תחרותיות","תושייה","דייקנות","נטילת סיכונים","סבלנות",
    "חוסר סבלנות","אנרגיה גבוהה","קושי להתחייב","מודעות לגוף ולבריאות" ] },
  { id:"values", label:"ערכים ואופי", members:[
    "נאמנות","נדיבות","רדיפת צדק","כנות ישירה","אחריות","עצמאות","אידיאליזם חברתי","רוחניות",
    "כנות","אמינות","ענווה","אמונה","חיפוש משמעות","מרדנות","שמרנות" ] },
];
const TRAIT_CAT_BY_NAME = (() => {
  const m = {};
  TRAIT_CATEGORIES.forEach(c => c.members.forEach(n => { m[normalizeTraitName(n)] = c.id; }));
  return m;
})();

/* קטלוג הבחירה: כל תכונות 12 המזלות + תכונות הספרייה, בלי כפילויות.
   לכל פריט יש מפרט מלא: כשזה עובד / הצד השני / שאלה לחשיבה. */
const TRAIT_CATALOG = (() => {
  const seen = new Set();
  const out = [];
  const push = (name, spec, from) => {
    const key = normalizeTraitName(name);
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ key, name, spec, from, cat: TRAIT_CAT_BY_NAME[key] || "values" });
  };
  ZODIAC_DATA.forEach(z => [...z.traits, ...z.extraTraits].forEach(t => push(t.name, t, z.id)));
  TRAIT_LIBRARY.forEach(t => {
    if (t.names.some(n => seen.has(normalizeTraitName(n)))) return; // כבר קיימת, למשל כתכונת מזל
    push(t.names[0], t, null);
  });
  return out;
})();

/* תכונה שהמשתמש הוסיף -> אובייקט עם light/shadow/q.
   אם יש בספרייה: הטקסט מהספרייה. אם לא: מה שהמשתמש כתב בעצמו + שאלה כללית. */
function resolveCustomTrait(c){
  const lib = TRAIT_LOOKUP[normalizeTraitName(c.name)];
  if (lib) return { ...c, isCustom: true, fromLibrary: true, light: lib.light, shadow: lib.shadow, q: lib.q };
  return {
    ...c, isCustom: true, fromLibrary: false,
    light: c.light || "", shadow: c.shadow || "",
    q: `מתי התכונה "${c.name}" שירתה אותך טוב — ומתי הובילה אותך למקום שלא ציפית?`
  };
}

/* ═══════════════════════════════════════
   2. חישוב מזל לפי תאריך לידה
   ═══════════════════════════════════════ */
function zodiacForDate(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  if (!m || !d) return null;
  const ranges = [
    ["aries",(m===3&&d>=21)||(m===4&&d<=19)],
    ["taurus",(m===4&&d>=20)||(m===5&&d<=20)],
    ["gemini",(m===5&&d>=21)||(m===6&&d<=20)],
    ["cancer",(m===6&&d>=21)||(m===7&&d<=22)],
    ["leo",(m===7&&d>=23)||(m===8&&d<=22)],
    ["virgo",(m===8&&d>=23)||(m===9&&d<=22)],
    ["libra",(m===9&&d>=23)||(m===10&&d<=22)],
    ["scorpio",(m===10&&d>=23)||(m===11&&d<=21)],
    ["sagittarius",(m===11&&d>=22)||(m===12&&d<=21)],
    ["capricorn",(m===12&&d>=22)||(m===1&&d<=19)],
    ["aquarius",(m===1&&d>=20)||(m===2&&d<=18)],
    ["pisces",(m===2&&d>=19)||(m===3&&d<=20)],
  ];
  const found = ranges.find(([,cond])=>cond);
  return found ? zodiacIndex[found[0]] : null;
}

/* ═══════════════════════════════════════
   2ב. הזנת תאריך לידה — שלושה שדות מספריים (יום / חודש / שנה)
   במקום שדה type="date" שבחלק מהטלפונים לא נפתח בו כלום.
   בכל טלפון שדות כאלה פותחים מקלדת מספרית רגילה.
   ═══════════════════════════════════════ */
function parseBirth({ d, m, y }) {
  const empty = !d && !m && !y;
  if (empty) return { iso: null, error: null };
  // עד שהמשתמש לא סיים להקליד שנה בת 4 ספרות — לא מציגים שגיאה
  if (!d || !m || y.length < 4) return { iso: null, error: null };
  const day = Number(d), month = Number(m), year = Number(y);
  const now = new Date();
  if (year < 1900 || year > now.getFullYear()) return { iso: null, error: "השנה צריכה להיות בין 1900 להיום." };
  if (month < 1 || month > 12) return { iso: null, error: "החודש צריך להיות בין 1 ל-12." };
  const dt = new Date(year, month - 1, day);
  const real = dt.getFullYear() === year && dt.getMonth() === month - 1 && dt.getDate() === day;
  if (!real) return { iso: null, error: "התאריך הזה לא קיים בלוח השנה. כדאי לבדוק את היום והחודש." };
  if (dt > now) return { iso: null, error: "התאריך הזה עוד לא קרה." };
  const pad = (n) => String(n).padStart(2, "0");
  return { iso: `${year}-${pad(month)}-${pad(day)}`, error: null };
}

function BirthDateFields({ value, onChange, onSubmit, canSubmit }) {
  const mRef = useRef(null);
  const yRef = useRef(null);
  const digits = (s, max) => s.replace(/\D/g, "").slice(0, max);
  const set = (key, max, next) => (e) => {
    const v = digits(e.target.value, max);
    onChange({ ...value, [key]: v });
    if (v.length === max && next && next.current) next.current.focus();
  };
  const onKey = (e) => { if (e.key === "Enter" && canSubmit) onSubmit(); };
  const common = { type: "text", inputMode: "numeric", pattern: "[0-9]*", autoComplete: "off", onKeyDown: onKey };
  return (
    <div className="date-fields" dir="ltr" role="group" aria-label="תאריך לידה">
      <div className="date-field">
        <span className="date-field-label">יום</span>
        <input {...common} className="date-input" placeholder="dd" maxLength={2}
          value={value.d} onChange={set("d", 2, mRef)} aria-label="יום בחודש"/>
      </div>
      <div className="date-field">
        <span className="date-field-label">חודש</span>
        <input {...common} ref={mRef} className="date-input" placeholder="mm" maxLength={2}
          value={value.m} onChange={set("m", 2, yRef)} aria-label="חודש"/>
      </div>
      <div className="date-field wide">
        <span className="date-field-label">שנה</span>
        <input {...common} ref={yRef} className="date-input" placeholder="yyyy" maxLength={4}
          value={value.y} onChange={set("y", 4, null)} aria-label="שנת לידה"/>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   6ב. TraitPicker — בחירת תכונות נוספות מרשימה, עם מפרט מלא לכל תכונה
   ═══════════════════════════════════════ */
function TraitPicker({ ownKeys, addedKeys, onPick, onWriteOwn, onClose }) {
  const [query, setQuery] = useState("");
  const [cat, setCat] = useState("all");
  const [openKey, setOpenKey] = useState(null);

  // תכונות המזל של המשתמש עצמו כבר מוצגות למעלה, אז הן לא מופיעות ברשימה
  const available = TRAIT_CATALOG.filter(t => !ownKeys.has(t.key));
  const q = normalizeTraitName(query);
  const items = available.filter(t =>
    (cat === "all" || t.cat === cat) && (!q || t.name.includes(q))
  );
  const countFor = (id) => available.filter(t => id === "all" || t.cat === id).length;

  return (
    <div className="pick-panel">
      <div className="pick-head-row">
        <h3 className="pick-title">בחר/י תכונות נוספות שמתארות אותך</h3>
        <button className="ghost" onClick={onClose}>סגור</button>
      </div>
      <p className="pick-sub">לחיצה על שם התכונה פותחת את המפרט המלא שלה. כפתור + מוסיף אותה לכרטיסים שלך, ושם אפשר לדרג אותה ולכתוב עליה.</p>

      <input className="pick-search" value={query} onChange={e => setQuery(e.target.value)}
        placeholder="חיפוש תכונה…" aria-label="חיפוש תכונה" maxLength={30}/>

      <div className="pick-cats" role="group" aria-label="קטגוריות">
        <button className={`pick-cat ${cat === "all" ? "active" : ""}`} onClick={() => setCat("all")}>
          הכול ({countFor("all")})
        </button>
        {TRAIT_CATEGORIES.map(c => (
          <button key={c.id} className={`pick-cat ${cat === c.id ? "active" : ""}`} onClick={() => setCat(c.id)}>
            {c.label} ({countFor(c.id)})
          </button>
        ))}
      </div>

      <div className="pick-list">
        {items.length === 0 && (
          <p className="pick-empty">לא נמצאה תכונה בשם הזה. אפשר לכתוב תכונה משלך למטה.</p>
        )}
        {items.map(t => {
          const open = openKey === t.key;
          const added = addedKeys.has(t.key);
          const signName = t.from ? zodiacIndex[t.from].name : null;
          return (
            <div key={t.key} className={`pick-item ${open ? "open" : ""} ${added ? "added" : ""}`}>
              <div className="pick-row">
                <button className="pick-toggle" onClick={() => setOpenKey(open ? null : t.key)} aria-expanded={open}>
                  <span>{t.name}</span>
                  {signName && <span className="pick-from">ממזל {signName}</span>}
                  <span className="pick-chev" aria-hidden="true">{open ? "▴" : "▾"}</span>
                </button>
                <button className="pick-add" disabled={added} onClick={() => onPick(t)}
                  aria-label={added ? `${t.name} כבר נוספה` : `הוסף את ${t.name}`}>
                  {added ? "✓" : "+"}
                </button>
              </div>
              {!open && <p className="pick-preview">{t.spec.light}</p>}
              {open && (
                <div className="pick-detail">
                  <div className="trait-sides">
                    <div className="side light">
                      <div className="side-label">✦ כשזה עובד</div>
                      <p>{t.spec.light}</p>
                    </div>
                    <div className="side shadow">
                      <div className="side-label">◈ הצד השני</div>
                      <p>{t.spec.shadow}</p>
                    </div>
                  </div>
                  <div className="tc-question"><p>💭 {t.spec.q}</p></div>
                  <button className="pick-detail-add" disabled={added} onClick={() => onPick(t)}>
                    {added ? "נוספה לתכונות שלי ✓" : "הוסף לתכונות שלי"}
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <p className="pick-footer">
        לא מצאת? <button className="link-btn" onClick={onWriteOwn}>כתוב/י תכונה משלך</button>
      </p>
    </div>
  );
}

function AddTraitForm({ onAdd, onCancel }) {
  const [name, setName] = useState("");
  const valid = name.trim().length >= 2;
  const known = valid && !!TRAIT_LOOKUP[normalizeTraitName(name)];
  return (
    <div className="add-form">
      <label style={{display:"block", fontSize:".78rem", fontWeight:700, color:"var(--ink-mid)", marginBottom:8}}>
        שם התכונה
      </label>
      <input
        autoFocus value={name} onChange={e => setName(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter" && valid) onAdd(name.trim()); if (e.key === "Escape") onCancel(); }}
        placeholder="למשל: יצירתיות, סבלנות, אמינות…"
        maxLength={40}
      />
      {valid && (
        <p className={`add-hint ${known ? "known" : ""}`}>
          {known
            ? "✓ יש לנו פירוט מוכן לתכונה הזו: כשזה עובד, הצד השני ושאלה לחשיבה."
            : "אין לנו ניסוח מוכן לתכונה הזו. אחרי ההוספה אפשר לנסח בעצמך את שני הצדדים שלה."}
        </p>
      )}
      <div className="add-form-row">
        <button className="confirm-add" disabled={!valid} onClick={() => onAdd(name.trim())}>הוסף תכונה</button>
        <button className="cancel-add" onClick={onCancel}>ביטול</button>
      </div>
    </div>
  );
}

function Portrait({ zodiac, profile }) {
  const [toast, setToast] = useState(null);

  const shownExtras = zodiac.extraTraits.filter(t =>
    profile.showExtra || profile.ratings[t.id] > 0 || (profile.importance[t.id] || 0) > 0);
  const allTraits = [
    ...[...zodiac.traits, ...shownExtras].map(t => ({
      id: t.id, name: t.name,
      rating: profile.ratings[t.id] || 0,
      importance: profile.importance[t.id] || 0,
      note: (profile.notes || {})[t.id] || "",
    })),
    ...(profile.customTraits || []).map(c => ({
      id: c.id, name: c.name,
      rating: profile.ratings[c.id] || 0,
      importance: profile.importance[c.id] || 0,
      note: (profile.notes || {})[c.id] || "",
    }))
  ];

  const sorted = [...allTraits].sort((a, b) => {
    if (b.importance !== a.importance) return b.importance - a.importance;
    return b.rating - a.rating;
  });

  const ratedCount = allTraits.filter(t => t.rating > 0).length;
  const avgRating = ratedCount > 0
    ? (allTraits.reduce((s, t) => s + t.rating, 0) / ratedCount).toFixed(1)
    : "—";

  const topTrait = sorted.find(t => t.rating > 0 || t.importance > 0);
  const el = zodiac.element;

  const buildShareText = () => {
    const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
    const lines = [
      `✦ הפרופיל שלי — מזל ${zodiac.name} ${zodiac.symbol}`,
      `${ELEMENT_EMOJI[el]} יסוד ${el} · ${zodiac.rulingPlanet} · ${zodiac.quality}`,
      `"${zodiac.tagline}"`,
      ``,
      `התכונות שלי לפי סדר חשיבות:`,
    ];
    sorted.forEach((t, i) => {
      const imp = t.importance > 0 ? IMP_LABELS[t.importance] : "לא דורג";
      const rat = t.rating > 0 ? stars(t.rating) : "—";
      lines.push(`${i + 1}. ${t.name}`);
      lines.push(`   נוכחות: ${rat} | חשיבות: ${imp}`);
      if (t.note) lines.push(`   "${t.note.trim()}"`);
    });
    lines.push(``);
    lines.push(`נבנה עם האפליקציה "מזלות"`);
    return lines.join("\n");
  };

  const handleShare = async () => {
    const text = buildShareText();
    if (navigator.share) {
      try {
        await navigator.share({ title: `הפרופיל שלי — מזל ${zodiac.name}`, text });
        return;
      } catch {}
    }
    try {
      await navigator.clipboard.writeText(text);
      setToast("הסיכום הועתק — אפשר להדביק ולשמור אצלך ✓");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      setToast("הסיכום הועתק — אפשר להדביק ולשמור אצלך ✓");
    }
    setTimeout(() => setToast(null), 2200);
  };

  return (
    <div>
      {toast && <div className="share-toast">{toast}</div>}

      <div className="portrait-hero">
        <div className="sym">{zodiac.symbol}</div>
        <h2>מזל {zodiac.name}</h2>
        <div className="sub">{ELEMENT_EMOJI[el]} {el} · {zodiac.rulingPlanet} · {QUALITY_DESC[zodiac.quality]}</div>
      </div>

      <div className="portrait-grid">
        <div className="pg-card">
          <div className="pg-label">תכונות שדירגתי</div>
          <div className="pg-val">{ratedCount} / {allTraits.length}</div>
          <div className="pg-sub">ממוצע נוכחות: {avgRating}</div>
        </div>
        <div className="pg-card">
          <div className="pg-label">תכונות שהוספתי</div>
          <div className="pg-val">{(profile.customTraits || []).length} תכונות</div>
          <div className="pg-sub">מעבר למה שהמזל מציע</div>
        </div>
        {topTrait && (
          <div className="pg-card" style={{gridColumn:"span 2"}}>
            <div className="pg-label">התכונה המרכזית שלי</div>
            <div className="pg-val">{topTrait.name}</div>
            <div className="pg-sub">לפי דירוג החשיבות שלי</div>
          </div>
        )}
      </div>

      {sorted.length > 0 && (
        <div className="portrait-traits">
          <h3>הפרופיל שלי — לפי סדר חשיבות</h3>
          {sorted.map((t, i) => (
            <div key={t.id} className="pt-item" style={{flexDirection:"column", alignItems:"stretch"}}>
              <div style={{display:"flex", alignItems:"center", gap:12}}>
                <div className="pt-rank">{i + 1}</div>
                <div className="pt-info">
                  <div className="pt-name">{t.name}</div>
                  <div className="pt-meta">
                    {t.importance > 0 ? IMP_LABELS[t.importance] : "חשיבות: לא דורגה"} ·{" "}
                    {t.rating > 0 ? `נוכחות ${t.rating}/5` : "נוכחות: לא דורגה"}
                  </div>
                </div>
                <div className="pt-stars">
                  {[5,4,3,2,1].map(n => (
                    <span key={n} className={`pt-star ${t.rating >= n ? "on" : ""}`}>★</span>
                  ))}
                </div>
              </div>
              {t.note && <div className="pt-note">{t.note}</div>}
            </div>
          ))}
        </div>
      )}

      <div className="portrait-cta">
        <p><b>הפרופיל הזה הוא שלך.</b> המזל מציע נקודת התחלה — אבל <b>אתה/ת זה/ו שמגדיר/ה</b> כמה כל תכונה נוכחת בחיים שלך ועד כמה היא חשובה לך. אפשר לחזור ולעדכן בכל עת.</p>
      </div>

      <button className="share-btn" onClick={handleShare}>
        ✦ שלח/י לעצמי את הסיכום
      </button>
      <a className="share-btn wa-btn" target="_blank" rel="noopener noreferrer"
        href={"https://wa.me/?text=" + encodeURIComponent(buildShareText())}>
        שלח/י בוואטסאפ
      </a>
    </div>
  );
}

function aspectOf(aId, bId) {
  const ia = ZODIAC_DATA.findIndex(z => z.id === aId);
  const ib = ZODIAC_DATA.findIndex(z => z.id === bId);
  const diff = Math.abs(ia - ib);
  const dist = Math.min(diff, 12 - diff);
  return { dist, ...ASPECTS[dist] };
}

                  <p><strong>{partner.name}:</strong> {LOVE2[partner.id].conflict}</p>
                </Block>
                <Block title="מה כל אחד צריך מהשני">
                  <p><strong>{partner.name} צריך/ה ממך:</strong> {LOVE[partner.id].needs}. כדאי לשים לב ל{LOVE[partner.id].watch}.</p>
                  <p><strong>את/ה צריך/ה מ{partner.name}:</strong> {me.needs}. אולי תצטרכו לעזור לו/ה להבין את {me.watch}.</p>
                </Block>
                <Block title="איך ליצור הרמוניה ביניכם">
                  <p>{ASP_TIPS[asp.dist].h}</p>
                  <p>{pairText(EL_TIPS, EL_ORDER, zodiac.element, partner.element).h}</p>
                  <p><strong>מה {zodiac.name} יכול/ה לתרגל:</strong></p>
                  <Bullets items={HARM[zodiac.id].h}/>
                  <p><strong>מה {partner.name} יכול/ה לתרגל:</strong></p>
                  <Bullets items={HARM[partner.id].h}/>
                </Block>
                <Block title="ממה להיזהר בקשר הזה">
                  <p>{ASP_TIPS[asp.dist].c}</p>
                  <p>{pairText(EL_TIPS, EL_ORDER, zodiac.element, partner.element).c}</p>
                  <p><strong>{zodiac.name}:</strong> {HARM[zodiac.id].c.join(", ")}. מה פוגע: {HARM[zodiac.id].t}.</p>
                  <p><strong>{partner.name}:</strong> {HARM[partner.id].c.join(", ")}. מה פוגע: {HARM[partner.id].t}.</p>
                </Block>
              </div>
            </div>
          )}
        </div>
      )}

      {mode === "seek" && (
        <div className="love-panel">
          <p className="lp-h">המזלות שהכי מתאימים למזל {zodiac.name}</p>
          <p className="lp-sub">מדורגים לפי היחס ביניכם, עם מה כל אחד מביא ואיך מזהים אותו בהיכרות.</p>
          {best.map(({ z, a }) => (
            <div className="rec-card" key={z.id}>
              <div className="rec-top">
                <span className="rec-name">{z.symbol} {z.name}</span>
                <span className="rec-stars">{stars(a.score)}</span>
              </div>
              <div className="match-kind">{a.name} · {ELEMENT_EMOJI[z.element]} {z.element} · {z.quality}</div>
              <p>{a.text}</p>
              <p className="rec-need"><strong>מה {z.name} יביא/תביא:</strong> {LOVE2[z.id].gifts.join(", ")}.</p>
              <p className="rec-need"><strong>מה {z.name} מחפש/ת:</strong> {LOVE[z.id].needs}.</p>
              <p className="rec-need"><strong>איך זה נראה בהיכרות:</strong> {LOVE2[z.id].court}.</p>
              <p className="rec-need"><strong>שפת האהבה:</strong> {LOVE2[z.id].lang}.</p>
              <p className="rec-need"><strong>כדאי לשים לב:</strong> {LOVE[z.id].watch}.</p>
              <p className="rec-need"><strong>מה מחבר ביניכם:</strong> {pairText(EL_PAIR, EL_ORDER, zodiac.element, z.element)}</p>
              <p className="rec-need"><strong>איך ליצור הרמוניה:</strong> {ASP_TIPS[a.dist].h} {pairText(EL_TIPS, EL_ORDER, zodiac.element, z.element).h}</p>
              <p className="rec-need"><strong>ממה להיזהר:</strong> {ASP_TIPS[a.dist].c} {pairText(EL_TIPS, EL_ORDER, zodiac.element, z.element).c}</p>
              <p className="rec-need"><strong>מה פוגע ב{z.name}:</strong> {HARM[z.id].t}.</p>
            </div>
          ))}
          <p className="lp-or">מזלות שדורשים יותר עבודה, אבל יכולים להצמיח:</p>
          {growth.map(({ z, a }) => (
            <div className="rec-card soft" key={z.id}>
              <div className="rec-top">
                <span className="rec-name">{z.symbol} {z.name}</span>
                <span className="rec-stars">{stars(a.score)}</span>
              </div>
              <div className="match-kind">{a.name}</div>
              <p>{a.text}</p>
            </div>
          ))}
        </div>
      )}

      <p className="love-note">ההתאמה מבוססת על היחס בין המזלות באסטרולוגיה הקלאסית, על היסוד ועל האיכות של כל מזל. זה כלי להרהור והשראה; מה שקובע הוא האדם עצמו.</p>
    </div>
  );
}

const TABS = ["גילוי המזל", "תכונות שלי", "הפרופיל שלי", "זוגיות"];

function App() {
  const [bd, setBd] = useState({ d: "", m: "", y: "" });
  const birth = parseBirth(bd);
  const [tab, setTab] = useState(0);
  const [showAddForm, setShowAddForm] = useState(false);
  const [showPicker, setShowPicker] = useState(false);
  const [profile, setProfile] = useState(() => loadProfile() || {
    birthdate: null,
    zodiacId: null,
    ratings: {},
    importance: {},
    notes: {},
    customTraits: [],
  });

  const zodiac = profile.zodiacId ? zodiacIndex[profile.zodiacId] : null;
  const [started, setStarted] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const discovered = !!zodiac && started;

  useEffect(() => { saveProfile(profile); }, [profile]);

  const handleDiscover = () => {
    if (!birth.iso) return;
    const z = zodiacForDate(birth.iso);
    if (!z) return;
    setProfile(p => ({ ...p, birthdate: birth.iso, zodiacId: z.id }));
    setStarted(true);
    setTab(1);
  };

  const updateRating = (traitId, val) =>
    setProfile(p => ({ ...p, ratings: { ...p.ratings, [traitId]: val } }));

  const updateImportance = (traitId, val) =>
    setProfile(p => ({ ...p, importance: { ...p.importance, [traitId]: val } }));

  const updateNote = (traitId, val) =>
    setProfile(p => ({ ...p, notes: { ...(p.notes || {}), [traitId]: val } }));

  // בחירת תכונה מהרשימה: נשמר רק השם, והמפרט המלא נשלף מהקטלוג בעת התצוגה
  const addPicked = (item) => {
    const id = "custom_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    setProfile(p => ({ ...p, customTraits: [...(p.customTraits || []), { id, name: item.name, picked: true }] }));
  };

  const addCustom = (name) => {
    const id = "custom_" + Date.now();
    setProfile(p => ({ ...p, customTraits: [...(p.customTraits || []), { id, name }] }));
    setShowAddForm(false);
  };

  const editCustomSide = (id, field, val) =>
    setProfile(p => ({
      ...p,
      customTraits: (p.customTraits || []).map(c => c.id === id ? { ...c, [field]: val } : c)
    }));

  const deleteCustom = (id) =>
    setProfile(p => ({ ...p, customTraits: (p.customTraits || []).filter(c => c.id !== id) }));

  const reset = () => {
    if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 4000); return; }
    setConfirmReset(false);
    setStarted(false);
    setProfile({ birthdate: null, zodiacId: null, ratings: {}, importance: {}, notes: {}, customTraits: [] });
    setBd({ d: "", m: "", y: "" });
    setTab(0);
  };

  const customForTab = zodiac ? (profile.customTraits || []).map(resolveCustomTrait) : [];
  const customKeys = new Set(customForTab.map(c => normalizeTraitName(c.name)));
  // תכונות נוספות של המזל, בלי מה שהמשתמש כבר הוסיף בעצמו מהרשימה
  const extrasForTab = zodiac ? zodiac.extraTraits.filter(t => !customKeys.has(normalizeTraitName(t.name))) : [];
  const setShowExtra = (v) => setProfile(p => ({ ...p, showExtra: v }));

  const renderTraitCard = trait => (
    <TraitCard key={trait.id} trait={trait} isCustom={!!trait.isCustom}
      rating={profile.ratings[trait.id] || 0}
      importance={profile.importance[trait.id] || 0}
      note={(profile.notes || {})[trait.id] || ""}
      onRate={v => updateRating(trait.id, v)}
      onImport={v => updateImportance(trait.id, v)}
      onNote={v => updateNote(trait.id, v)}
      onEditSide={(field, v) => editCustomSide(trait.id, field, v)}
      onDelete={() => deleteCustom(trait.id)}/>
  );

  return (
    <div className="shell">
      <header className="top">
        <div className="top-brand">
          <span className="sym">{discovered ? zodiac.symbol : "✦"}</span>
          <div>
            <h1>מזלות</h1>
            <p>מסע גילוי עצמי דרך תכונות האופי</p>
          </div>
        </div>
        <div className="top-right">
          {zodiac && <button className="ghost" onClick={reset}>{confirmReset ? "בטוח/ה? לחץ/י שוב למחיקה" : "התחל מחדש"}</button>}
        </div>
      </header>

      <div className="page">
        {(
          <div className="tab-bar">
            {TABS.map((t, i) => (
              <button key={t} className={`tab ${tab === i ? "active" : ""}`}
                onClick={() => { if (zodiac) setStarted(true); setTab(i); }}
                disabled={(i === 2 && Object.keys(profile.ratings).length === 0) || (!zodiac && i > 0)}>
                {t}
              </button>
            ))}
          </div>
        )}

        {/* ── Tab 0: Intro / Reveal ── */}
        {(!discovered || tab === 0) && !discovered && (
          <div className="intro-wrap">
            <div className="intro-symbol">✦</div>
            <h2>המזל שלי</h2>
            <p>הזן/י את תאריך הלידה שלך ונגלה יחד אילו תכונות אופי משויכות למזל שלך — ותוכל/י לדרג אותן, להוסיף תכונות משלך ולבנות פרופיל אישי.</p>
            <div className="date-box">
              <label>תאריך לידה</label>
              <BirthDateFields value={bd} onChange={setBd} onSubmit={handleDiscover} canSubmit={!!birth.iso}/>
              {birth.error && <p className="date-error" role="alert">{birth.error}</p>}
              <button className="big-btn" onClick={handleDiscover} disabled={!birth.iso}>
                גלה/י את המזל שלי ←
              </button>
              {zodiac && (
                <button className="ghost" style={{marginTop:12, width:"100%"}} onClick={() => { setStarted(true); setTab(1); }}>
                  המשך מהפרופיל השמור שלי (מזל {zodiac.name})
                </button>
              )}
            </div>
          </div>
        )}

        {discovered && tab === 0 && (
          <div className="reveal-wrap">
            <div className="reveal-sym">{zodiac.symbol}</div>
            <div className="reveal-el">{ELEMENT_EMOJI[zodiac.element]} יסוד {zodiac.element}</div>
            <h2>מזל {zodiac.name}</h2>
            <p className="dates-sub">{zodiac.dates}</p>
            <blockquote className="reveal-tagline">{zodiac.tagline}</blockquote>
            <div className="reveal-chips">
              <span className="chip">כוכב שליט <strong>{zodiac.rulingPlanet}</strong></span>
              <span className="chip">איכות <strong>{zodiac.quality}</strong></span>
              <span className="chip">יסוד <strong>{zodiac.element}</strong></span>
            </div>
            <button className="big-btn" style={{maxWidth:320, margin:"0 auto"}} onClick={() => setTab(1)}>
              גלה/י את התכונות שלי ←
            </button>
          </div>
        )}

        {/* ── Tab 1: Traits ── */}
        {discovered && tab === 1 && (
          <div>
            <div className="section-head">
              <h3>תכונות מזל {zodiac.name}</h3>
              <p>דרג/י כל תכונה לפי כמה היא נוכחת בך ועד כמה היא חשובה לך</p>
            </div>

            {zodiac.traits.map(renderTraitCard)}

            {extrasForTab.length > 0 && (profile.showExtra ? (
              <div className="extra-block">
                <div className="extra-head">
                  <span>✦ עוד תכונות אופייניות למזל {zodiac.name}</span>
                  <button className="ghost" onClick={() => setShowExtra(false)}>הסתר</button>
                </div>
                {extrasForTab.map(renderTraitCard)}
              </div>
            ) : (
              <button className="add-trait-btn extra-btn" onClick={() => setShowExtra(true)}>
                ✦ הצג/י עוד {extrasForTab.length} תכונות אופייניות למזל {zodiac.name}
              </button>
            ))}

            {customForTab.map(renderTraitCard)}

            {showPicker && (
              <TraitPicker
                ownKeys={new Set([...zodiac.traits, ...zodiac.extraTraits].map(t => normalizeTraitName(t.name)))}
                addedKeys={new Set((profile.customTraits || []).map(c => normalizeTraitName(c.name)))}
                onPick={addPicked}
                onWriteOwn={() => { setShowPicker(false); setShowAddForm(true); }}
                onClose={() => setShowPicker(false)}/>
            )}

            {showAddForm
              ? <AddTraitForm onAdd={addCustom} onCancel={() => setShowAddForm(false)}/>
              : (
                <div className="add-actions">
                  {!showPicker && (
                    <button className="add-trait-btn primary" onClick={() => setShowPicker(true)}>
                      ＋ בחר/י תכונות נוספות מהרשימה
                    </button>
                  )}
                  <button className="add-trait-btn" onClick={() => setShowAddForm(true)}>
                    ✏️ כתוב/י תכונה משלי
                  </button>
                </div>
              )
            }

            {Object.keys(profile.ratings).length >= 2 && (
              <button className="big-btn" style={{marginTop:22}} onClick={() => setTab(2)}>
                צפה/י בפרופיל שלי ←
              </button>
            )}
          </div>
        )}

        {/* ── Tab 2: Portrait ── */}
        {discovered && tab === 2 && (
          <Portrait zodiac={zodiac} profile={profile}/>
        )}

        {/* ── Tab 3: Couple ── */}
        {discovered && tab === 3 && (
          <Couple zodiac={zodiac}/>
        )}
      </div>

      <footer>
        <p>מזלות · פרופיל אישי נשמר על המכשיר שלך בלבד</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
